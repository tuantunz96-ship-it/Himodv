name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image:ghcr.io/theos/theos:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Dylib
        run: |
          make
          mkdir -p output
          find .theos -name "*.dylib" -exec cp {} output/ \;

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuanModAOV-dylib
          path: output/*.dylib
