name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make perl zip unzip curl git xz-utils

      - name: Setup Theos, Toolchain & SDK
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS

          mkdir -p $THEOS/toolchain/linux/iphone
          curl -sL https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma -o tc.tar.lzma || true
          if [ -s tc.tar.lzma ]; then
            tar --lzma -xf tc.tar.lzma -C $THEOS/toolchain/linux/iphone --strip-components=1 || tar --lzma -xf tc.tar.lzma -C $THEOS/toolchain/linux/iphone
          else
            curl -sL https://github.com/ProcursusTeam/toolchain/releases/download/2023-07-02/iPhoneOS-arm64-linux-toolchain.tar.xz -o tc.tar.xz
            tar -xf tc.tar.xz -C $THEOS/toolchain/linux/iphone --strip-components=1 || tar -xf tc.tar.xz -C $THEOS/toolchain/linux/iphone
          fi

          mkdir -p $THEOS/sdks
          curl -sL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk $THEOS/sdks/

          find $THEOS/toolchain -maxdepth 4 -type d -name "bin"

      - name: Build Dylib
        run: |
          export THEOS=$HOME/theos
          BIN_DIR=$(find $THEOS/toolchain -type f -name "clang" -printf '%h\n' | head -n 1)
          echo "Found clang at: $BIN_DIR"
          if [ -n "$BIN_DIR" ]; then
            export PATH="$BIN_DIR:$PATH"
          fi
          make
          mkdir -p output
          find .theos -name "*.dylib" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuanModAOV-dylib
          path: output/*.dylib
